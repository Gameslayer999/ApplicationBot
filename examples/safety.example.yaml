# Submission safety switch (decision 035, Agent Guideline #3).
# Copy to profile/safety.yaml (git-ignored). A missing file means DISARMED (dry-run).
#
# Kill switch: create the file profile/KILL to halt ALL submission immediately
# (checked before every single submit); delete it to resume.

# Real submission only happens when this is true. Dry-run fills everything but never
# clicks submit.
armed: false

# Hard cap on real submissions in one run: the command-line runner's gate, and the auto-apply
# loop's ceiling too (decision 178) — the loop stops when it reaches this and says so, whatever
# its goal said. Editable in the UI under the loop panel's "⚙ Loop settings"; saving there
# rewrites this file and leaves every other key (armed included) exactly as it was.
max_submissions_per_run: 10

# Agentic fallbacks (decisions 061/076) — both OFF by default because they spend Claude tokens.
# Each one learns a site ONCE and stores a reusable recipe; replaying what is already learned is
# always on and free.
#   nav_agentic     — a Claude worker opens the application form on a site whose reveal button uses
#                     wording ApplicationBot doesn't know ("Join our team"). It is forbidden to fill,
#                     upload, or submit, and is never aimed at a site that blocked automated access.
#   workday_agentic — a Claude worker fills a Workday tenant's unrecognized custom fields.
nav_agentic: false
workday_agentic: false
