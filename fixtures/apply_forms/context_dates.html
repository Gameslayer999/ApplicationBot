<!doctype html>
<!-- A bare "Date" that is NOT the day you apply: same label as the signature-block one in
     signature_date.html, but the block around it says it belongs to the applicant's education.
     Only the surrounding text distinguishes them (decision 167).

     One "Date" per form on purpose: the fill keys answers by label, so a form with two identical
     bare labels only ever fills the first. -->
<html>
<head><meta charset="utf-8"><title>Education block</title></head>
<body>
<form>
  <h3>Education</h3>
  <p>Tell us about the most recent school you attended.</p>
  <div><label for="school">School</label><input id="school" type="text"></div>
  <div><label for="degree">Degree</label><input id="degree" type="text"></div>
  <div><label for="edate">Date</label><input id="edate" type="text"></div>
</form>
</body>
</html>
