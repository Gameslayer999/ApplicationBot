<!doctype html>
<html>
<head><meta charset="utf-8"><title>Check-all-that-apply fixture</title></head>
<body>
<form>
  <label for="fn">First Name</label>
  <input id="fn" name="first_name" type="text">

  <fieldset>
    <legend>Language Skill(s) (Check all that apply)</legend>
    <label><input type="checkbox" name="lang" value="eng"> English (ENG)</label>
    <label><input type="checkbox" name="lang" value="spa"> Spanish (SPA)</label>
    <label><input type="checkbox" name="lang" value="fra"> French (FRA)</label>
    <label><input type="checkbox" name="lang" value="deu"> German (DEU)</label>
  </fieldset>
</form>
</body>
</html>
