<!doctype html>
<!-- The closing block of a real application form: a signature line whose "Date" means the day you
     apply, next to date questions that are about the APPLICANT and must not be answered with
     today. Shapes taken from Palantir's Greenhouse form, where a bare "Date" was filled with the
     applicant's availability sentence (decision 166). -->
<html>
<head><meta charset="utf-8"><title>Signature block</title></head>
<body>
<form>
  <label for="startdate">Earliest start date</label>
  <input id="startdate" type="text" name="startdate">

  <label for="dob">Date of birth</label>
  <input id="dob" type="text" name="dob">

  <label for="grad">Graduation date</label>
  <input id="grad" type="text" name="grad">

  <label for="sig">Signature</label>
  <input id="sig" type="text" name="sig">

  <label for="today">Date</label>
  <input id="today" type="text" name="today">

  <label for="signed">Today's date</label>
  <input id="signed" type="date" name="signed">
</form>
</body>
</html>
