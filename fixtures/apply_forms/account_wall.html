<!doctype html>
<html>
<head><meta charset="utf-8"><title>Account-gated portal sign-in fixture</title></head>
<body>
<!-- What an account-gated portal serves in answer to "Apply" (decision 168). Modelled on the
     Taleo/Avature shape probed 2026-07-30: two or three boxes that a field-counting form
     detector reads as a short application form. The password box is the tell. -->
<h1>Sign in to continue your application</h1>
<form>
  <label for="user">User Name</label>
  <input id="user" name="user" type="text">

  <label for="pw">Password</label>
  <input id="pw" name="pw" type="password">

  <button type="submit">LOG IN</button>
</form>
<a href="#">Create an account</a>
</body>
</html>
